name: RADAR PHONE checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: API startup smoke test
        env:
          RADAR_API_TOKEN: ci-test-token
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/radar-phone.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/radar-phone.log
          exit 1
